server:
  port: 8083
spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/LMS"
    username: root
    password: ${DB_PASSWORD:change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 200MB
# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3005,http://localhost:3001}

# Logging
#logging:
#  level:
#    com.app.lms: INFO
#    org.springframework.security: WARN
#    org.hibernate: WARN
#  pattern:
#    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
app:
  jwt:
    secret: ${JWT_SECRET:change_me_this_is_default_secret_and_should_be_changed}

# External Services Configuration
notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8080}
  course:
    review:
      base-url: ${COURSE_REVIEW_BASE_URL:http://localhost:3000/admin/courses/approve}

identity:
  service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8080}

# VNPay Payment Gateway Configuration
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:change_me}
  secret-key: ${VNPAY_SECRET_KEY:change_me}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8083/api/payment/vnpay-return}
  # Note: frontend-url tự động lấy từ cors.allowed-origins (port 3000 hoặc 3001)


# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
# Development profile settings
---
spring:
  config:
    activate:
      on-profile: development

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3005,http://localhost:3001}

logging:
  level:
    org.springframework.web.cors: DEBUG
    org.springframework.security: DEBUG

