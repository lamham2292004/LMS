# ==============================================================================
# Docker Compose - Production Override
# Learning Management System (LMS)
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==============================================================================

services:
  # ============================================================================
  # MySQL Database - Production Settings
  # ============================================================================
  mysql:
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-LMS}
    # Production MySQL optimizations
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=500
      - --innodb_buffer_pool_size=1G
      - --innodb_log_file_size=256M
      - --innodb_flush_log_at_trx_commit=2
      - --slow_query_log=1
      - --slow_query_log_file=/var/lib/mysql/slow.log
      - --long_query_time=2
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_backup:/backup
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================================================
  # Spring Boot Application - Production Settings
  # ============================================================================
  lms-app:
    restart: always
    image: lms-app:${APP_VERSION:-latest}
    environment:
      # Production profile
      SPRING_PROFILES_ACTIVE: prod
      
      # Security - require JWT secret in production
      APP_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      
      # Database credentials
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Database password is required}
      
      # Disable SQL logging in production
      SPRING_JPA_SHOW_SQL: "false"
      
      # Production JPA settings
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      
      # Logging
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_COM_APP_LMS: INFO
      
      # JVM memory settings for production
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:InitialRAMPercentage=50.0
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+UseStringDeduplication
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/app/logs/heapdump.hprof
        -Djava.security.egd=file:/dev/./urandom
        
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      # Replicas for scaling (requires Docker Swarm)
      # replicas: 2
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    # Production health check with stricter timing
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # ============================================================================
  # Nginx Reverse Proxy (Production Only)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: lms-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - lms-app
    networks:
      - lms-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================================================
  # Redis Cache (Production Only)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - lms-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ==============================================================================
# Production Volumes
# ==============================================================================
volumes:
  mysql_data:
    driver: local
  mysql_backup:
    driver: local
  app_uploads:
    driver: local
  app_logs:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
